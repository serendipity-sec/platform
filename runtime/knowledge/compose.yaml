name: flowdelta-knowledge
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KNOWLEDGE_DB_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: flowdelta_knowledge
      POSTGRES_USER: flowdelta_admin
      POSTGRES_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Run tools/prepare-knowledge.ps1 first}
      KNOWLEDGE_APP_PASSWORD: ${KNOWLEDGE_APP_PASSWORD:?Run tools/prepare-knowledge.ps1 first}
    volumes:
      - knowledge-postgres:/var/lib/postgresql/data
      - ./init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U flowdelta_admin -d flowdelta_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  knowledge-postgres:
