name: review-check

# platform PR은 작성자 외 팀원 1명 이상 Approve 후 머지합니다(CONTRIBUTING.md).
# Free 플랜이라 GitHub가 머지를 막지 못하므로, 커밋 상태 `approval`로 빨간불·초록불만 표시합니다.
# 같은 context의 상태는 최신 값으로 덮어써지므로, 리뷰가 들어오면 같은 PR의 빨간불이 초록불로 바뀝니다.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read # 리뷰 목록 조회
  statuses: write # approval 상태 기록

jobs:
  set-approval-status:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 승인 수 확인
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # 리뷰어별 마지막 상태만 셉니다(COMMENTED 제외). 승인 뒤 변경 요청을 남기면 승인으로 치지 않습니다
          approvals=$(gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" | jq --arg a "$AUTHOR" '
            [.[] | select(.user.login != $a and .state != "COMMENTED")]
            | group_by(.user.login) | map(last.state) | map(select(. == "APPROVED")) | length')
          if [ "$approvals" -ge 1 ]; then
            state=success; desc="승인 ${approvals}명"
          else
            state=failure; desc="팀원 1명 승인 필요"
          fi
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context=approval -f description="$desc" > /dev/null
          echo "approval: $state ($desc)"
