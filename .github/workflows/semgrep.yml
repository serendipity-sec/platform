name: semgrep

# Semgrep AppSec Platform 무료 티어(기여자 10명·private 저장소 10개)로 SAST·의존성·시크릿을 검사합니다.
# PR은 바뀐 부분만, 매일 1회는 main 전체를 검사합니다. 결과는 semgrep.dev 대시보드와 PR 댓글로 봅니다.
# SEMGREP_APP_TOKEN이 아직 없으면 실패하지 않고 건너뜁니다 (CONTRIBUTING.md "자동 검사").
# 컨테이너 이미지는 digest로 고정합니다. Dependabot이 갱신하지 않으므로 학기 중 한 번씩 수동으로 올립니다.

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [.github/workflows/semgrep.yml]
  schedule:
    - cron: "37 18 * * *" # 매일 03:37 KST

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep/ci
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - name: 토큰 확인
        if: env.SEMGREP_APP_TOKEN == ''
        run: echo "::notice title=semgrep 건너뜀::SEMGREP_APP_TOKEN secret이 없어 검사를 건너뜁니다"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SEMGREP_APP_TOKEN != ''
        with:
          persist-credentials: false

      - name: semgrep ci
        if: env.SEMGREP_APP_TOKEN != ''
        run: semgrep ci
