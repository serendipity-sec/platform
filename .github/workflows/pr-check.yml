name: pr-check

# Squash merge 하면 PR 제목이 그대로 main 커밋 메시지가 되므로 제목 규칙을 여기서 검사합니다.
# 외부 Action 없이 셸만 씁니다. PR 제목·본문은 신뢰할 수 없는 입력이라 env로만 넘깁니다.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: PR 제목 — Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|refactor|test|chore|experiment|ci|perf|build|style|revert)(\([^)]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error title=PR 제목 규칙::'<type>(<scope>): <요약>' 형식이어야 합니다. 예) docs: 3회차 회의록 추가 / feat(scanner): SKILL.md 파서"
            exit 1
          fi

      - name: 이슈 연결 — Closes #N
        if: github.actor != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?):?[[:space:]]*#[0-9]+' <<< "$BODY"; then
            echo "::error title=이슈 연결 없음::PR 본문에 'Closes #이슈번호'를 적어 주세요. 모든 작업은 이슈에서 시작합니다."
            exit 1
          fi

      - name: 브랜치 이름 (권장)
        if: github.actor != 'dependabot[bot]'
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD" =~ ^(feat|fix|docs|refactor|test|chore|experiment)/[0-9]+-[a-z0-9._-]+$ ]]; then
            echo "::warning title=브랜치 이름::권장 형식은 <type>/<이슈번호>-<짧은-설명> 입니다. 예) feat/12-skill-md-parser"
          fi
