name: flowdelta-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  input-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.9.30
      - run: uv sync --frozen --extra baseline
      - run: uv run --frozen --extra baseline ruff check src tests
      - run: uv run --frozen --extra baseline ruff format --check src tests
      - run: uv run --frozen --extra baseline mypy
      - run: uv run --frozen --extra baseline pytest
      - run: uv run --frozen --extra baseline flowdelta inspect-case examples/order-lookup
      - run: uv run --frozen --extra baseline flowdelta check-examples examples/contracts/order-lookup
      - run: uv run --frozen --extra baseline flowdelta inspect-case examples/support-triage
      - run: uv run --frozen --extra baseline flowdelta check-examples examples/contracts/support-triage
      - run: uv build

  normal-n8n-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.9.30
      - run: uv sync --frozen --extra baseline
      - run: docker build --tag flowdelta-order-fixture:0.2.0 --file runtime/order-lookup/fixture.Dockerfile .
      - run: uv run --frozen --extra baseline flowdelta baseline --out var/ci-baseline
      - run: docker build --tag flowdelta-order-fixture:0.3.0 --file runtime/order-lookup/fixture.Dockerfile .
      - run: uv run --frozen --extra baseline flowdelta demo-order-lookup --out var/ci-integrated-order
      - run: uv run --frozen --extra baseline flowdelta check-pipeline var/ci-integrated-order/bundle

  normal-node-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.9.30
      - run: uv sync --frozen --extra baseline
      - run: uv run --frozen --extra baseline flowdelta conformance --out var/ci-conformance
      # Preserve registered synthetic fixture diagnostics, never private state or credentials.
      - name: Preserve node conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            var/ci-conformance/summary.json
            var/ci-conformance/runs.json
            var/ci-conformance/*/run.json
            var/ci-conformance/*/publication.json
            var/ci-conformance/*/comparison.json
            var/ci-conformance/*/runtime-executions.json
            var/ci-conformance/*/bootstrap.log
            var/ci-conformance/*/import-*.log
            var/ci-conformance/*/publish-*.log
            var/ci-conformance/*/stdout.log
            var/ci-conformance/*/stderr.log
