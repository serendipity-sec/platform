name: secret-scan

# 검사 대상 자료와 개발 코드 모두에서 토큰·키가 커밋되는 것을 막습니다.
# 기술 스택이 정해지면(6주차) 같은 폴더에 ci.yml(빌드·테스트·린트)을 추가합니다.
# Action은 태그 대신 커밋 SHA로 고정합니다. 버전 갱신은 Dependabot이 PR로 올립니다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@0186870afd2c4a90def791d80260923ba583d076 # v3.98.0
        with:
          extra_args: --results=verified,unknown
