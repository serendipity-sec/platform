name: secret-scan

# 검사 대상 자료와 개발 코드 모두에서 토큰·키가 커밋되는 것을 막습니다.
# 기술 스택이 정해지면(6주차) 같은 폴더에 ci.yml(빌드·테스트·린트)을 추가합니다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
